# Publishes the repository's app page: `site/` with the holo that `just app`
# builds and verifies through the locked SDK. Project content, not universal
# policy: a repository may extend or replace it.
#
# It runs on every push to main, beside `bootstrap`, not after it: `just app`
# is the proof-bearing build (the Lean kernel checks every theorem before the
# holo exists), so the page goes live as soon as that passes, while the rest of
# the gate runs on both architectures. The SDK step and the signing step are
# the ones `build.yml` runs, copied here: the gate pins every `uses:` to a
# commit and so forbids calling a workflow by path. When `build.yml` changes
# either step, copy it again. The page then carries the same holo that
# `prism-code build --remote github` would hand a device, with the signed
# provenance of the run that made it beside it.
name: pages

on:
  push:
    branches: [main]
  # Every gate the deploy runs also runs on a pull request, so nothing merges
  # that main cannot publish. Only a main push or a manual run on main deploys.
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Main deploys one at a time and is never cancelled; a newer push to a pull
# request cancels its older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || (github.event_name == 'merge_group' && format('pages-mq-{0}', github.run_id)) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # The check a pull request must pass: the same name on every event.
    name: page / gates
    # The template repository publishes its try page instead (try-page.yml).
    if: github.repository != 'UOR-Foundation/template'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the brand and the frame against brand.lock and frame.lock
        shell: bash
        run: |
          set -euo pipefail
          node bootstrap/brand-sync.mjs --check
          python3 -I bootstrap/brand-fonts.py --check
          node bootstrap/frame-sync.mjs --check
      # The proof is the slow part (15 to 25 minutes). This job reuses one
      # exactly as bootstrap.yml and `just app` do: the cache key only finds a
      # candidate, and `xtask
      # proof-reuse` accepts it only if its attestation binds this checkout,
      # this image's Lean and Lake, the architecture and every input file. A
      # tag or a manual run proves in full. A reused proof leaves no holo, so
      # the holo is then built (six minutes, no proof) and must carry the very
      # build ID the reused attestation verified, or this job fails.
      - name: Name the SDK image digest and the Lean toolchain the proof runs on
        id: proof-inputs
        shell: bash
        run: |
          set -euo pipefail
          sdk=$(sed -n 's/.*"sdk_image":"[^"@]*@sha256:\([0-9a-f]\{64\}\)".*/\1/p' prismpm.lock)
          lean=$(sed -n 's/^leanprover\/lean4:\(v[0-9A-Za-z.-]*\)$/\1/p' app/lean-toolchain)
          test -n "$sdk"
          test -n "$lean"
          printf 'sdk=%s\nlean=%s\n' "$sdk" "$lean" >>"$GITHUB_OUTPUT"
      # This job keeps its own proofs: bootstrap.yml proves inside `just vv`,
      # and a holo built here never carries the build ID of a proof made
      # there (seen on main: same inputs, different build). A page proof is
      # reused only by a later page build, under the same read-time check.
      - name: The proof of these exact proof inputs, kept by an earlier page build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .prism-proof
          key: prism-page-proof-${{ runner.os }}-${{ runner.arch }}-sdk-${{ steps.proof-inputs.outputs.sdk }}-lean-${{ steps.proof-inputs.outputs.lean }}-${{ hashFiles('app/**', 'prismpm.lock', 'Justfile', 'rust-toolchain.toml') }}
      - name: Build and verify the holo through the locked SDK
        shell: bash
        env:
          PRISM_PROOF_EVENT: ${{ github.event_name }}:${{ github.ref }}
        run: |
          set -euo pipefail
          image=$(sed -n 's/.*"sdk_image":"\([^"]*\)".*/\1/p' prismpm.lock)
          if [[ ! $image =~ ^[a-z0-9.-]+(:[0-9]{1,5})?/[a-z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' 'prismpm.lock does not select an immutable SDK image' >&2
            exit 64
          fi
          docker_config=$(mktemp -d)
          trap 'rm -rf "$docker_config"' EXIT
          printf '{}\n' >"$docker_config/config.json"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --tmpfs /tmp:rw,exec,nosuid,size=2g \
            --volume "$PWD:$PWD" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$docker_config:/tmp/prismpm-home/.docker:ro" \
            --workdir "$PWD" \
            --env DOCKER_CONFIG=/tmp/prismpm-home/.docker \
            --env BUILDX_CONFIG=/tmp/prismpm-buildx \
            --env HOME=/tmp/prismpm-home \
            --env PRISMPM_EPHEMERAL_HOME=1 \
            --env PRISM_PROOF_EVENT \
            --env SDK_IMAGE="$image" \
            "$image" bash -c '
              set -euo pipefail
              just app
              shopt -s nullglob
              holos=(app/.prism/build/*/*.holo)
              if [[ ${#holos[@]} -eq 0 ]]; then
                proved=$(grep -o "\"build_id\": *\"[0-9a-f]\{64\}\"" .prism-proof/verified/manifest.json | grep -o "[0-9a-f]\{64\}")
                test -n "$proved"
                prismpm --project app build
                holos=(app/.prism/build/*/*.holo)
                test ${#holos[@]} -eq 1
                built=$(basename "$(dirname "${holos[0]}")")
                if [[ $built != "$proved" ]]; then
                  # Not the build the reused proof verified: that proof says
                  # nothing about this holo, so prove this tree in full.
                  printf "the holo built here (%s) is not the build the reused proof verified (%s): proving in full\n" "$built" "$proved" >&2
                  rm -rf app/.prism .prism-proof
                  PRISM_PROOF_EVENT= just app
                  holos=(app/.prism/build/*/*.holo)
                  test ${#holos[@]} -eq 1
                else
                  echo "the holo is build $built, the build the reused proof verified"
                fi
              fi
            '
      - name: Find the holo
        id: holo
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          holos=(app/.prism/build/*/*.holo)
          if [[ ${#holos[@]} -ne 1 ]]; then
            printf 'expected one holo, found %d\n' "${#holos[@]}" >&2
            exit 64
          fi
          fingerprint=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).archive_fingerprint)' "$(dirname "${holos[0]}")/application/holo-identities.json")
          {
            echo "path=${holos[0]}"
            echo "fingerprint=$fingerprint"
          } >>"$GITHUB_OUTPUT"
      - name: Sign the holo's provenance as this repository's workflow
        id: attest
        # Only a build that is published is signed. A pull request's page links
        # its run instead, and is never deployed.
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.holo.outputs.path }}
          show-summary: false
      - name: Draw the social image and the icons for this app.json
        # page.mjs refuses an og.png or icon not drawn for this app.json. Drawing
        # them here, with Pillow pinned by hash, means a new app needs neither
        # Python nor Pillow on its author's machine; the committed images only
        # serve a local preview.
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/draw"
          "$RUNNER_TEMP/draw/bin/pip" install --quiet --no-deps --only-binary :all: --require-hashes -r bootstrap/draw-requirements.txt
          "$RUNNER_TEMP/draw/bin/python" -I bootstrap/og.py
          "$RUNNER_TEMP/draw/bin/python" -I bootstrap/icons.py
      - name: Assemble the page
        shell: bash
        env:
          HOLO: ${{ steps.holo.outputs.path }}
          FINGERPRINT: ${{ steps.holo.outputs.fingerprint }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          set -euo pipefail
          cp "$HOLO" site/app.holo
          cp -r try/vendor site/vendor
          rm -rf site/vendor/prism-code/fixtures
          rm -rf site/vault/test
          # The page says where this holo's provenance is: the signed statement
          # GitHub keeps for the build that made it.
          node -e '
            const { readFileSync, writeFileSync } = require("node:fs");
            const [id, url] = process.argv.slice(1);
            const app = JSON.parse(readFileSync("site/app.json", "utf8"));
            app.attestations ??= {};
            app.attestations.build = { id, url };
            writeFileSync("site/app.json", `${JSON.stringify(app, null, 2)}\n`);
          ' "$FINGERPRINT" "$ATTESTATION_URL"
          node bootstrap/page.mjs site
          # Every pinned object set (R4's engine and weights, R4-01, and any
          # other `bootstrap/*-objects.mjs`), fetched from its pinned commit and
          # served as SHA-256-named pieces under the 16 MiB limit. A new set is
          # served, and checked below, without editing this workflow.
          for objects in bootstrap/*-objects.mjs; do
            node "$objects" site
          done
          node bootstrap/precache.mjs site
      - name: No personal data in the assembled page (PV-01)
        # The same gate `just vv` runs over the tracked tree, here over every
        # file the page publishes. It names the file, line and kind of a
        # finding, never the value, because this log is public.
        shell: bash
        run: |
          set -euo pipefail
          cargo run -q --locked -p xtask -- audit-pii site
      - name: Lighthouse at 100 on mobile, before anything is deployed
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --global @lhci/cli@0.15.1
          lhci autorun --config=lighthouserc.json
      - name: Every Material 3 window size class, both themes, before anything is deployed
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --global playwright@1.56.1
          playwright install --with-deps chromium
          node bootstrap/screens.mjs site screens
      # Every browser acceptance under test/ runs here, on every pull request
      # and before every deploy: each `test/<suite>/run.mjs` (R4-01 and the
      # rest) and every `*.test.mjs` (PG-01 and the rest). A new suite is in CI
      # the moment it is committed; none runs only on someone's machine.
      - name: Every browser acceptance under test/, from the pieces this page serves
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="$(npm root --global)"
          shopt -s nullglob globstar
          runners=(test/*/run.mjs)
          suites=(test/**/*.test.mjs)
          test ${#runners[@]} -gt 0
          test ${#suites[@]} -gt 0
          for runner in "${runners[@]}"; do
            echo "::group::$runner"
            node "$runner"
            echo "::endgroup::"
          done
          node --test "${suites[@]}"
      - name: Keep the screens
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: screens
          path: screens
          if-no-files-found: ignore
      - name: Configure Pages
        if: steps.attest.outcome == 'success'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload the page
        if: steps.attest.outcome == 'success'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site

  deploy:
    name: publish the page
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      # The published page itself, in a real browser: it keeps, refuses while
      # halted and answers through the app, or this run fails. Pages can take
      # a minute to serve the new bytes, so the check gets four tries.
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The published page works (PG-01, live)
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --global playwright@1.56.1
          playwright install --with-deps chromium
          for attempt in 1 2 3 4; do
            NODE_PATH="$(npm root --global)" node --test test/page/card.test.mjs && exit 0
            sleep 30
          done
          exit 1
