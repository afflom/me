# model/ids.toml --- the conformance ID register.
#
# Every ID this repository claims, in one place, so that nothing is referenced
# without being defined. `CONFORMANCE.md` is generated from this file. A test
# whose name ends in an ID not listed here fails `check-model`, and an ID listed
# here with no scenario and no test fails it too (CM-02).
#
# `level` is the honesty level (R2):
#   some-true  a fact reproduced from an authority; not established here
#   build      constructed here and validated against its oracle
#   open       measured and reported, never asserted
#
# Every row here has a scenario in `features/suites/` and a test whose name ends
# in the ID, lowercased with underscores (R3, CM-02). There is no "pending"
# state: a capability that is not built does not get a row, and every row in this
# file is built.
#
# The first row is the template's own Prism application in `app/` (TC-01).
# A capability starts with a row here; `just new-capability` writes the row,
# its scenario and its failing test in the order `AGENTS.md` sets out.

spec = "template/1"

[[id]]
id = "TC-01"
level = "build"
suite = "contract"
statement = "The checker answers conformant exactly when every universal policy file's observed digest equals its locked digest"

[[id]]
id = "FR-01"
level = "build"
suite = "frame"
statement = "With a working worker, the page loads and verifies the archive only in that worker before using its identities or guest"

[[id]]
id = "PV-01"
level = "build"
suite = "privacy"
statement = "Neither the tracked tree nor the built page holds personal data: every email address is at a reserved domain, and no phone, payment card or national ID number appears"

[[id]]
id = "VS-01"
level = "build"
suite = "vault"
statement = "The vault keeps a value only when the Boundary and the proved store decision allow it: sealed under a non-extractable device key, filed under an address that re-derives from the value, and as a keyed hash only for card or restricted data"

[[id]]
id = "VS-02"
level = "build"
suite = "vault"
statement = "The vault restores a value only when the proved restore decision allows it: a flipped bit, a swapped object, an unknown envelope or a lost key ring is refused, and nothing is deleted"

[[id]]
id = "VS-03"
level = "build"
suite = "vault"
statement = "The owner's device key is made by the browser and never leaves it: no passphrase is asked to keep or read a value, only to make or read an encrypted export, and a wrong or tampered export is refused"

[[id]]
id = "GG-01"
level = "build"
suite = "google"
statement = "The page makes a Google API call only when PrismGoogle answers fetch, which it never does while halted, to any other host, without a fresh read grant, or for a write without the owner's act"

[[id]]
id = "GG-02"
level = "build"
suite = "google"
statement = "The Google connection moves between stages only as PrismGoogleLink answers: only the owner grants, a client for another origin is never used, and the kill switch or a forget revokes every grant"

[[id]]
id = "GG-03"
level = "build"
suite = "google"
statement = "Mail and calendar items read from Google reach only the browser vault, through the detectors, the router and the Boundary, by GET to the two API hosts with the token only in the Authorization header"
