# model/ids.toml --- the conformance ID register.
#
# Every ID this repository claims, in one place, so that nothing is referenced
# without being defined. `CONFORMANCE.md` is generated from this file. A test
# whose name ends in an ID not listed here fails `check-model`, and an ID listed
# here with no scenario and no test fails it too (CM-02).
#
# `level` is the honesty level (R2):
#   some-true  a fact reproduced from an authority; not established here
#   build      constructed here and validated against its oracle
#   open       measured and reported, never asserted
#
# Every row here has a scenario in `features/suites/` and a test whose name ends
# in the ID, lowercased with underscores (R3, CM-02). There is no "pending"
# state: a capability that is not built does not get a row, and every row in this
# file is built.
#
# The Prism's own rows (PM-*) cover the application in `app/`.
# A capability starts with a row here; `just new-capability` writes the row,
# its scenario and its failing test in the order `AGENTS.md` sets out.

spec = "template/1"

[[id]]
id = "FR-01"
level = "build"
suite = "frame"
statement = "With a working worker, the page loads and verifies the archive only in that worker before using its identities or guest"

[[id]]
id = "PV-01"
level = "build"
suite = "privacy"
statement = "Neither the tracked tree nor the built page holds personal data: every email address is at a reserved domain, and no phone, payment card or national ID number appears"

[[id]]
id = "PM-01"
level = "build"
suite = "prism"
statement = "The Prism answers a request naming a known facet with exactly that facet's decision of the rest, and refuses every other request"

[[id]]
id = "PM-02"
level = "build"
suite = "prism"
statement = "The Boundary denies every move while halted and every move to GitHub or the hosted verifier, never allows detected, restricted or identifying data out, and never sends outbound without the owner's approval"

[[id]]
id = "PM-03"
level = "build"
suite = "prism"
statement = "Learning confirms or rejects a belief only on the owner's signal, holds a confirmed or rejected belief against every other signal, and never raises a weight above 15 or lowers it below 1"

[[id]]
id = "PM-04"
level = "build"
suite = "prism"
statement = "Chronology never names an Allen relation that the two intervals' endpoints contradict, and never calls two well-formed intervals malformed"

[[id]]
id = "R4-01"
level = "build"
suite = "r4"
statement = "The R4 language model runs in the browser only from bytes that re-derive to their pinned SHA-256, served by the page in pieces of at most 16 MiB, and shows an answer only when the proved Prism R4 decision allows it"

[[id]]
id = "MD-01"
level = "build"
suite = "models"
statement = "A language or reasoning model routed into the Prism runs in the browser only when the proved Prism Models decision says run: pinned by hub commit and SHA-256, in a format with a locked runtime, granted by the owner, and not halted; its answer is shown only through R4's routed mode and the Boundary"

[[id]]
id = "VS-01"
level = "build"
suite = "vault"
statement = "The vault keeps a value only when the Boundary and the proved store decision allow it: sealed under a non-extractable device key, filed under an address that re-derives from the value, and as a keyed hash only for card or restricted data"

[[id]]
id = "VS-02"
level = "build"
suite = "vault"
statement = "The vault restores a value only when the proved restore decision allows it: a flipped bit, a swapped object, an unknown envelope or a lost key ring is refused, and nothing is deleted"

[[id]]
id = "VS-03"
level = "build"
suite = "vault"
statement = "The owner's device key is made by the browser and never leaves it: no passphrase is asked to keep or read a value, only to make or read an encrypted export, and a wrong or tampered export is refused"

[[id]]
id = "RT-01"
level = "build"
suite = "route"
statement = "The vocabulary register the page reads lists schema.org 30.1's 939 types and 1,538 properties, the 12 domains and the 1,229 crosswalk rows in the order of the Lean indices, every source pinned by sha256"

[[id]]
id = "GG-01"
level = "build"
suite = "google"
statement = "The page makes a Google API call only when PrismGoogle answers fetch, which it never does while halted, to any other host, without a fresh read grant, or for a write without the owner's act"

[[id]]
id = "GG-02"
level = "build"
suite = "google"
statement = "The Google connection moves between stages only as PrismGoogleLink answers: only the owner grants, a client for another origin is never used, and the kill switch or a forget revokes every grant"

[[id]]
id = "GG-03"
level = "build"
suite = "google"
statement = "Mail and calendar items read from Google reach only the browser vault, through the detectors, the router and the Boundary, by GET to the two API hosts with the token only in the Authorization header"

[[id]]
id = "PG-01"
level = "build"
suite = "page"
statement = "The page keeps, reads and answers only through the verified app: a note is kept at its domain's floor only when the Boundary and the vault allow it, nothing is kept while halted, and an outbound act is only drafted until the owner's Send"

[[id]]
id = "DS-01"
level = "build"
suite = "dest"
statement = "The Prism routes an item to a destination only as PrismDest answers: nothing leaves without the owner's act on the very words they saw, nothing coercive is carried out or pushed into the owner's view, nothing without a cause is routed, restricted content never leaves, quiet is kept, and the kill switch stops every route"

[[id]]
id = "DS-02"
level = "build"
suite = "dest"
statement = "The page hands an item to the owner's calendar, mail or another platform only after the Boundary and PrismDest answer deliver for the owner's press, through an app the owner already uses, with no host called and no setup"

[[id]]
id = "PG-02"
level = "build"
suite = "page"
statement = "The page is PrismSurface made visible: one place per owner view of the design model, showing that view's domains under its role, every act and setting in its modeled place, and every visible word a name from the model"

[[id]]
id = "KP-01"
level = "build"
suite = "kappa"
statement = "The Prism reads a kappa label as UOR-Foundation/kappa-registry's Kappa::parse does and admits an object under it only when the proved Prism Kappa decision says admit: a label without its colon, on an unknown axis, of the wrong digit count or not in lowercase hex is refused with its own answer, and bytes that do not re-derive, collide on SHA-1 or could not be re-derived are never admitted"

[[id]]
id = "KP-02"
level = "build"
suite = "kappa"
statement = "The browser re-derives a kappa label's digest only with what its host computes (SHA-256 and SHA-512), names every object on SHA-256 as kappa-registry's mandatory secondary axis, never admits on an axis it cannot compute, and obeys no answer from the guest it does not expect"

[[id]]
id = "HL-01"
level = "build"
suite = "holon"
statement = "The Prism's observer decides what to do next for each facet only as the proved PrismHolon answers: every facet, the owner and the Prism itself among them, has a directive, an objective and a KPI floor; nothing changes while halted, on the Prism's own measures alone, for a parameter no spec marks tunable, or when the owner and the Prism agree; high dissonance is reconciled toward the owner; and a floor the facet regressed below is restored"

[[id]]
id = "HL-02"
level = "build"
suite = "holon"
statement = "A candidate set of a facet's tunable parameters replaces what runs only as the proved PrismCurate answers: a Rule-30 hypothesis only when it strictly Pareto-dominates what runs, a reconciliation only when it eases the owner's dismissals, never with a humane defect, without the owner's gestures, below the floor, off its spec's bounds or step, or while halted, and always under a kappa label the kappa facet admitted, minted once"

[[id]]
id = "HL-03"
level = "build"
suite = "holon"
statement = "The observer runs in the owner's browser on the resonance engine's signals: it measures every facet's KPI from the owner's own gestures, advances the 64-cell Rule-30 register (the spec's vectors), replays each candidate on the window, carries one line to each facet through the root guest, obeys no answer it does not expect, keeps its state (parameters, register, claim labels, no content) in this browser, and hands only adopted parameters to the engine"

[[id]]
id = "DV-01"
level = "build"
suite = "device"
statement = "The page lists or reads on the owner's device only when PrismFolder answers read, which it never does while halted, without the browser's grant, for a write, for a file that is not mail, calendar or contacts, or for one too large to read at once"

[[id]]
id = "DV-02"
level = "build"
suite = "device"
statement = "Mail, calendar and contacts read from the owner's device reach only the browser vault, through the detectors and the Boundary, from a folder opened read-only or files the owner picked or dropped"

[[id]]
id = "DV-03"
level = "build"
suite = "device"
statement = "The page uses each surface the browser reports for the owner's content only as PrismHost answers: every reported surface is used or offered, nothing is used while halted, a paste, drop, pick or contact list only on the owner's act, a folder only on the owner's act or a grant the browser keeps, and a live account on another origin is named sealed"

[[id]]
id = "PG-03"
level = "build"
suite = "page"
statement = "Every act on the page completes end to end: what the owner sends is the very event or message they reviewed and is kept in the place it left from at that domain's floor, every kept item opens to its words, and Ask draws on the kept items that share its words, never while halted, under the highest label it drew on"

[[id]]
id = "CO-01"
level = "build"
suite = "coherence"
statement = "The owner brings content in through the feeders the coherence registry names and every place that lists things lists it: Today shows the agenda ahead with what falls today and what clashes as PrismChronology answers, and Ask answers at once with the owner's own kept items that meet it, only as the Boundary allows, never while halted"

[[id]]
id = "CO-02"
level = "build"
suite = "coherence"
statement = "Every facet the Prism root routes is one model in the coherence registry with typed ports, live with the page modules that ask it or sealed by a PrismHost surface, and the build refuses a registry whose flow leaves a port unproduced or untaken, a place unfed, an act or setting undriven, a feeder's media without a domain or a domain without vocabulary"

[[id]]
id = "CO-03"
level = "build"
suite = "coherence"
statement = "A kept item belongs to its media's domain and to every domain whose vocabulary in the coherence registry it uses, and an Ask finds the span its intent words name"

[[id]]
id = "CO-04"
level = "build"
suite = "coherence"
statement = "A zip the owner picks or drops, such as a Google Takeout export, opens in the browser to its entries, stored or deflated and ZIP64 included, each judged by PrismFolder by its own format"
