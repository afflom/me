spec = "lexlean/project/1"
name = "prism-transition-generators"
language = "1.2"
module_prefix = "PrismTransitionGen"
source_roots = ["src"]
entrypoints = ["src/Foundation/Bytes.lex.tex", "src/Foundation/Json.lex.tex", "src/Foundation/Tar.lex.tex", "src/Foundation/Utf8.lex.tex", "src/GenJcs.lex.tex", "src/GenNames.lex.tex", "src/GenPatch.lex.tex", "src/GenRec.lex.tex", "src/GenReplay.lex.tex", "src/GenStore.lex.tex", "src/GenSuite.lex.tex", "src/Generators.lex.tex", "src/Sha256.lex.tex"]
build_root = ".lexlean"
lockfile = "lexlean.lock"
lean_workspace = "."
lean_toolchain = "leanprover/lean4:v4.32.1"

[[lexicon_source]]
package = "lexlean.std.nat"
kind = "builtin"

[[lexicon_source]]
package = "prism.arch"
kind = "path"
path = "language/prism.arch"

[limits]
max_file_bytes = 4194304
max_total_source_bytes = 67108864
max_primitive_atoms = 2000000
max_token_lattice_edges = 4000000
max_parse_states = 4000000
max_ir_nodes = 2000000
max_scope_depth = 1024
max_import_depth = 128
max_diagnostics = 256
max_child_output_bytes = 16777216
child_timeout_ms = 1800000
