[application]
name = "prism-dest"
version = "0.1.0"
description = "Decides where one thing the Prism holds may go next: shown to the owner, held quietly, drafted for the owner, delivered to their calendar, mail or another platform, or refused."

[model]
source = "src"
watch = ["src/**/*.lex.tex", "language/**/*.toml", "lexlean.toml"]

# Deny by default: an empty set grants the holo nothing.
[capabilities]
