[application]
name = "prism-kappa"
version = "0.1.0"
description = "Decides whether one object may enter the Prism under its kappa label, the content address of UOR-Foundation/kappa-registry, read as Kappa::parse reads it and admitted only when the browser re-derived its digest."

[model]
source = "src"
watch = ["src/**/*.lex.tex", "language/**/*.toml", "lexlean.toml"]

# Deny by default: an empty set grants the holo nothing.
[capabilities]
