[application]
name = "prism-vault-store"
version = "0.1.0"
description = "Decides whether the browser vault may keep one value, as its value or as a hash only, so that nothing is kept that the Boundary refused, that the owner has not yet approved, or that does not re-derive"

[model]
source = "src"
watch = ["src/**/*.lex.tex", "language/**/*.toml", "lexlean.toml"]

# Deny by default: an empty set grants the holo nothing.
[capabilities]
