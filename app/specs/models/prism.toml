[application]
name = "prism-models"
version = "0.1.0"
description = "Decides whether one language or reasoning model routed into the Prism from a hub such as Hugging Face may be fetched or run in the owner's browser, so that only a model pinned by revision and hash, in"

[model]
source = "src"
watch = ["src/**/*.lex.tex", "language/**/*.toml", "lexlean.toml"]

