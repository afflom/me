[application]
name = "prism-host"
version = "0.1.0"
description = "Decides how the owner's browser uses each surface it reports as a route for the owner's own content, so that every surface the browser exposes is used, nothing is used while the Prism is halted, nothi"

[model]
source = "src"
watch = ["src/**/*.lex.tex", "language/**/*.toml", "lexlean.toml"]

# Deny by default: an empty set grants the holo nothing.
