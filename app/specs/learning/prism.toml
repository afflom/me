[application]
name = "prism-learning"
version = "0.1.0"
description = "Decides how one fact about the owner changes when a new signal arrives, so the Prism learns from evidence within fixed bounds and only the owner can confirm or reject a fact."

[model]
source = "src"
watch = ["src/**/*.lex.tex", "language/**/*.toml", "lexlean.toml"]

# Deny by default: an empty set grants the holo nothing.
[capabilities]
