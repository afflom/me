[application]
name = "prism-vault-restore"
version = "0.1.0"
description = "Decides whether bytes read back from the browser vault may be handed out, so that tampered, swapped or unreadable objects are refused and hash-only records never come back as values."

[model]
source = "src"
watch = ["src/**/*.lex.tex", "language/**/*.toml", "lexlean.toml"]

# Deny by default: an empty set grants the holo nothing.
[capabilities]
